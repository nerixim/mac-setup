# Baseline global mise config. Installed to ~/.config/mise/config.toml by mise.sh.
# node/python/ruby/go use mise's first-party core plugins (no asdf aliases).
#
# One version per tool, pinned to a major/minor prefix: `mise install` resolves
# the newest patch at install time and `make mise-bump` (mise upgrade) moves
# within the prefix. Add extra versions per machine with `mise use -g node@22`.
# node stays on the active LTS line (26 becomes LTS in 2026-10).

[tools]
node = "24"
ruby = "4.0"
python = "3.14"
go = "1.27"
terraform = "1.16"
# Prefix, not `latest`: pnpm backports 11.x after 12, so GitHub's Latest tag
# (and asdf's sticky `latest` symlink) stay on 11. Aqua + semver pick 12.x.
pnpm = { version = "12", version_order = "semver" }

[settings]
legacy_version_file = true # honor project-level .tool-versions/.nvmrc/.ruby-version
trusted_config_paths = []
activate_aggressive = true # keep mise tool bins ahead of other PATH prepends (bun, etc.)
