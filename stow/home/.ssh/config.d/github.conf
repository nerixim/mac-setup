# GitHub over port 443 (ssh.github.com). Hotel and airport wifi often drop port 22;
# 443 gets through and works the same at home. Host keys: github_known_hosts here,
# taken from https://api.github.com/meta (ssh_keys) and checked against ssh_key_fingerprints.
Host github.com
  HostName ssh.github.com
  Port 443
  User git
  UserKnownHostsFile ~/.ssh/known_hosts ~/.ssh/config.d/github_known_hosts
