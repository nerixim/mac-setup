# Official Claude Code lines (Shift+Enter = newline; notifications reach iTerm).
# https://code.claude.com/docs/en/terminal-config
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Wheel/click go to Claude. Do not start with `tmux -CC`: iTerm integration
# mode breaks fullscreen rendering (mouse wheel and the alternate screen).
set -g mouse on

# Mac vs iPad: size the window to the client you just attached.
set -g window-size latest

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"
set -sg escape-time 10
set -g history-limit 50000
set -g set-clipboard on
set -g default-shell /opt/homebrew/bin/zsh
